            border: none;

            color: #333;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: var(--secondary-color);
            color: white;
        }

        .sub-nav {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .sub-btn {
            padding: 6px 16px;
            border: 1px solid var(--secondary-color);
            background: transparent;
            color: var(--secondary-color);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
        }

        .sub-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }

        .content-section {
            display: none;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .content-section.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f3f5;
            color: var(--primary-color);
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .grammar-block {
            margin-bottom: 25px;
            border-left: 4px solid var(--secondary-color);
            padding-left: 15px;
        }

        .grammar-title {
            font-size: 1.15rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .example-list {
            margin-left: 20px;
            color: #555;
        }

        .exercise-card {
            background-color: #fdfdfd;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .exercise-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .japanese {
            font-size: 1.05rem;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            th, td { padding: 8px; font-size: 0.9rem; }

</head>

let currentTab = 'vocab';

function switchLesson(lesson) {
    currentLesson = lesson;
    document.querySelectorAll('#lesson-nav .nav-btn').forEach((btn, index) => {
        btn.classList.toggle('active', (index + 3) === lesson);
    });
    renderContent();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.sub-nav .sub-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(tab));
    });
    renderContent();
}

function renderContent() {
    const main = document.getElementById('main-content');
    const lessonData = data[currentLesson];

    if (currentTab === 'vocab') {
        let html = `
            <div class="content-section active">
                <h2>Từ vựng Bài ${currentLesson}</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Hiragana</th>
                            <th>Kanji</th>
                            <th>Ý nghĩa</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        lessonData.vocab.forEach(item => {
            html += `
                <tr>
                    <td class="japanese">${item.hiragana}</td>
                    <td class="japanese">${item.kanji}</td>
                    <td>${item.meaning}</td>
                </tr>
            `;
        });
        html += `</tbody></table></div>`;
        main.innerHTML = html;
    } else if (currentTab === 'grammar') {
        let html = `<div class="content-section active"><h2>Ngữ pháp Bài ${currentLesson}</h2><br>`;
        lessonData.grammar.forEach(item => {
            html += `
                <div class="grammar-block">
                    <div class="grammar-title">${item.title}</div>
                    <p style="margin-bottom: 8px;">${item.desc}</p>
                    <ul class="example-list">
            `;
            item.examples.forEach(ex => {
                html += `<li class="japanese">${ex}</li>`;
            });
            html += `</ul></div>`;
        });
        html += `</div>`;
        main.innerHTML = html;
    } else if (currentTab === 'exercise') {
        let html = `<div class="content-section active"><h2>Bài tập Thực hành Bài ${currentLesson}</h2><br>`;
        lessonData.exercise.forEach(item => {
            html += `
                <div class="exercise-card">
                    <div class="exercise-title">${item.section}</div>
                    <div class="japanese">${item.content}</div>
                </div>
            `;
        });
        html += `</div>`;
        main.innerHTML = html;
    }
}

// Khởi chạy ban đầu
renderContent();
</script>

</body>
</html>
